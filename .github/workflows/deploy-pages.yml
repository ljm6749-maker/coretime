# GitHub Pages 배포
#
# 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 바꾸면
# main 브랜치에 푸시할 때마다 자동으로 배포됩니다.
#
# ※ 공개 저장소의 Pages 사이트는 인터넷에 공개됩니다.
#    사내 전용으로 운영하려면 README 의 "배포" 절을 참고해 접근 제어가 가능한
#    호스팅(Azure Static Web Apps + Entra ID, Cloudflare Pages + Access 등)을 쓰세요.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 단일 파일 빌드 (dist/)
        run: python3 build.py

      - name: 배포 폴더 구성
        run: |
          mkdir -p _site/assets
          cp -r index.html assets _site/
          cp dist/index.html _site/standalone.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
