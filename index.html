<!doctype html>

<head>

<meta name="description" content="한화비전 글로벌 코어타임 기준으로 법인별 현지 시각을 한 눈에 보고 회의 시간을 정하는 도구">

<!-- 메일 · 메신저에 링크를 붙여넣을 때 표시되는 정보 -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="한화비전 글로벌 코어타임">
<meta property="og:title" content="우리 몇 시에 만날까요?">
<meta property="og:description" content="한화비전 글로벌 코어타임 기준으로 법인별 현지 시각을 한 눈에 보고 회의 시간을 정하는 도구">
<meta property="og:url" content="https://coretime.pages.dev/">
<meta property="og:locale" content="ko_KR">
<meta property="og:locale:alternate" content="en_US">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="우리 몇 시에 만날까요?">
<meta name="twitter:description" content="한화비전 글로벌 코어타임 기준으로 법인별 현지 시각을 한 눈에 보고 회의 시간을 정하는 도구">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap">
<style>
/* ─────────────────────────────────────────────────────────────
   한화비전 글로벌 코어타임 — 스타일 (라이트 테마)
   밝은 회색 바탕에 흰 카드, 코어타임은 붉은 음영으로 표시합니다.
   ───────────────────────────────────────────────────────────── */

:root {
  --ground: #EDF0F5;          /* 페이지 바탕 */
  --surface: #FFFFFF;         /* 카드 */
  --surface-2: #F4F6FA;       /* 입력 · 보조 영역 */
  --surface-3: #E8ECF3;
  --line: #D5DCE7;
  --line-soft: #E4E9F1;
  --text: #17202E;
  --text-dim: #46536A;
  --muted: #7A8698;

  --accent: #F37321;          /* 브랜드 오렌지 */
  --accent-strong: #D95F12;
  --accent-soft: #FFF1E6;
  --accent-dim: rgba(243, 115, 33, 0.12);

  --core: #C83A24;                          /* 글로벌 코어타임 */
  --core-fill: #D2452C;
  --agree-fill: rgba(210, 69, 44, 0.16);
  --work-fill: #DCE7F8;
  --work-text: #26405F;
  --out-fill: #F2F4F8;
  --off-fill: #E2E6EE;

  --radius: 10px;
  --radius-lg: 16px;
  --shadow: 0 1px 2px rgba(16, 24, 40, 0.05), 0 10px 28px rgba(16, 24, 40, 0.06);

  /* 화면 전체는 본문 서체로 통일하고, 고정폭 서체는 메일 제목 · 본문 입력창에만 쓴다 */
  --font-sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--ground);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 15px;
  line-height: 1.6;
  letter-spacing: -0.01em;
}

h1, h2, h3 { margin: 0; font-weight: 600; text-wrap: balance; letter-spacing: -0.02em; }
p { margin: 0; }
ol, ul { margin: 0; padding: 0; list-style: none; }
button { font: inherit; color: inherit; }
table { border-collapse: collapse; }

.mono { font-family: var(--font-sans); font-variant-numeric: tabular-nums; }
.hl { color: var(--core); font-weight: 600; }

.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.eyebrow {
  font-family: var(--font-sans); font-size: 11px; letter-spacing: 0.18em;
  text-transform: uppercase; color: var(--accent-strong); margin-bottom: 8px;
}
.section__title { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px; font-size: 15px; }
.section__title span { font-size: 12px; font-weight: 400; color: var(--muted); }

.tag {
  display: inline-block; font-family: var(--font-sans); font-size: 9.5px;
  letter-spacing: 0.06em; padding: 1px 5px; border-radius: 3px;
  background: var(--surface-3); color: var(--muted); vertical-align: middle;
}
.tag--off { background: rgba(200, 58, 36, 0.12); color: var(--core); }
.tag--now { background: var(--accent-dim); color: var(--accent-strong); }

/* ── 상단 바 ─────────────────────────────────────────────── */

.topbar {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 14px clamp(16px, 4vw, 40px);
  background: rgba(255, 255, 255, 0.92);
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(10px);
}
.topbar__brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.topbar__mark {
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--accent); box-shadow: 0 0 0 4px var(--accent-dim); align-self: center;
}
.topbar__title { font-weight: 700; letter-spacing: 0.08em; font-size: 14px; }
.topbar__sub { color: var(--text-dim); font-size: 13px; padding-left: 10px; border-left: 1px solid var(--line); }

.langswitch {
  display: inline-flex; padding: 3px; gap: 3px; flex: 0 0 auto;
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px;
}
.langswitch__btn {
  border: 0; background: none; padding: 6px 14px; border-radius: 999px;
  font-size: 12.5px; color: var(--muted); cursor: pointer; white-space: nowrap;
  transition: background 0.16s ease, color 0.16s ease;
}
.langswitch__btn:hover { color: var(--text-dim); }
.langswitch__btn.is-active { background: var(--accent); color: #fff; font-weight: 600; }

/* ── 섹션 ───────────────────────────────────────────────── */

.board, .footer {
  max-width: 1440px; margin: 0 auto;
  padding: clamp(26px, 4vw, 44px) clamp(16px, 3.5vw, 40px);
}
.board__head { margin-bottom: 22px; }
.board h1 { font-size: clamp(26px, 3.4vw, 38px); line-height: 1.2; }
.board__lead { color: var(--text-dim); margin-top: 12px; max-width: 88ch; }

.legend { display: flex; gap: 16px; align-items: center; font-size: 12px; color: var(--text-dim); }
.legend li { display: flex; align-items: center; gap: 6px; }
.legend--flat { flex-wrap: wrap; gap: 14px; }
.legend__swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.legend__swatch--core { background: var(--core-fill); }
.legend__swatch--off {
  background-color: var(--off-fill);
  background-image: repeating-linear-gradient(135deg, rgba(0, 0, 0, 0.14) 0 2px, transparent 2px 5px);
}

/* ── 컨트롤 ─────────────────────────────────────────────── */

.controls {
  display: grid;
  grid-template-columns: minmax(170px, 200px) minmax(170px, 210px) minmax(130px, 165px) minmax(260px, 1fr);
  gap: 16px 24px; padding: 18px 20px;
  background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--radius-lg);
  margin-bottom: 16px; align-items: start; box-shadow: var(--shadow);
}
.field { display: flex; flex-direction: column; gap: 8px; border: 0; padding: 0; margin: 0; min-width: 0; }
.field__label {
  font-size: 11px; font-weight: 600; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--muted); padding: 0;
}
.field__input {
  display: block;
  width: 100%; min-width: 0; max-width: 100%;
  padding: 10px 12px;
  background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius);
  color: var(--text); font-family: var(--font-sans); font-size: 14px; color-scheme: light;
}
/* 날짜 미선택 상태에서는 '선택하세요' 안내를 덮어씌운다 */
.datewrap { position: relative; }
.datewrap__ph {
  position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
  pointer-events: none; color: var(--muted); font-size: 14px; display: none;
}
.datewrap.is-empty .datewrap__ph { display: block; }
.datewrap.is-empty input[type="date"]::-webkit-datetime-edit { opacity: 0; }

/* iOS Safari 의 날짜 입력은 고유 너비를 우선해 컨테이너 밖으로 삐져나온다 */
input[type="date"].field__input::-webkit-date-and-time-value { text-align: left; margin: 0; }
.field__input:hover { border-color: #B9C3D3; }
/* '선택하세요' 상태에서는 날짜 입력의 안내 문구와 같은 서체 · 색으로 맞춘다 */
.field__input.is-placeholder { font-family: var(--font-sans); color: var(--muted); }
.field__hint { font-size: 11.5px; color: var(--muted); }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; cursor: pointer; border-radius: 999px; }
.chip input { position: absolute; opacity: 0; width: 0; height: 0; }
.chip__body {
  display: inline-flex; align-items: baseline; gap: 6px; padding: 7px 12px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface); color: var(--text-dim); font-size: 13px;
  transition: background 0.16s ease, border-color 0.16s ease, color 0.16s ease;
}
.chip__code { font-family: var(--font-sans); font-size: 9.5px; letter-spacing: 0.08em; color: var(--muted); }
.chip:hover .chip__body { border-color: #B9C3D3; }
.chip input:checked + .chip__body {
  background: var(--accent-dim); border-color: var(--accent); color: var(--text); font-weight: 500;
}
.chip input:checked + .chip__body .chip__code { color: var(--accent-strong); }
.chip input:focus-visible + .chip__body { outline: 2px solid var(--accent); outline-offset: 2px; }
.chips__actions { display: flex; gap: 14px; margin-top: 2px; }

.linkbtn {
  background: none; border: 0; padding: 0; cursor: pointer;
  font-size: 12px; color: var(--muted); border-bottom: 1px solid transparent;
}
.linkbtn:hover { color: var(--accent-strong); border-bottom-color: currentColor; }

/* ── 날짜 탭 ────────────────────────────────────────────── */

.daytabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.daytab {
  display: inline-flex; align-items: baseline; gap: 5px;
  padding: 8px 14px; border-radius: var(--radius);
  border: 1px solid var(--line-soft); background: var(--surface);
  color: var(--text-dim); font-family: var(--font-sans); font-size: 13px; cursor: pointer;
  transition: border-color 0.14s ease, background 0.14s ease, color 0.14s ease;
}
.daytab:hover { border-color: #B9C3D3; color: var(--text); }
.daytab__dow { font-size: 10px; color: var(--muted); }
.daytab.is-weekend { color: #C0492F; }
.daytab.is-weekend .daytab__dow { color: #C0492F; }
.daytab.is-today { border-color: rgba(243, 115, 33, 0.4); }
.daytab.is-active {
  background: var(--accent); border-color: var(--accent);
  color: #fff; font-family: var(--font-sans); font-weight: 600;
}
.daytab.is-active .daytab__dow { color: rgba(255, 255, 255, 0.85); }
.daytab--nav { padding: 8px 12px; color: var(--muted); }

/* ── 시간표 ─────────────────────────────────────────────── */

.tt {
  background: var(--surface); border: 1px solid var(--line-soft);
  border-radius: var(--radius-lg); padding: 18px; margin-bottom: 22px;
  box-shadow: var(--shadow);
}
.tt__head {
  display: flex; flex-wrap: wrap; gap: 8px 20px;
  align-items: baseline; justify-content: space-between; margin-bottom: 14px;
}
.tt__body { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: stretch; gap: 8px; }
.tt__scroll { overflow-x: auto; padding-bottom: 4px; }

.tt__nav {
  align-self: stretch;
  width: 34px; padding: 0;
  border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--surface-2); color: var(--text-dim);
  font-size: 18px; line-height: 1; cursor: pointer;
  transition: border-color 0.14s ease, background 0.14s ease, color 0.14s ease;
}
.tt__nav:hover { border-color: var(--accent); background: var(--accent-dim); color: var(--accent-strong); }

@keyframes ttSlideNext {
  from { opacity: 0; transform: translateX(34px); }
  to { opacity: 1; transform: none; }
}
@keyframes ttSlidePrev {
  from { opacity: 0; transform: translateX(-34px); }
  to { opacity: 1; transform: none; }
}
.tt__grid--next { animation: ttSlideNext 0.84s cubic-bezier(0.22, 0.61, 0.36, 1); }
.tt__grid--prev { animation: ttSlidePrev 0.84s cubic-bezier(0.22, 0.61, 0.36, 1); }

.tt__grid {
  position: relative;
  display: grid;
  grid-template-columns: 240px repeat(24, minmax(26px, 1fr));
  gap: 3px;
  min-width: 940px;
  align-items: stretch;
}

.tt__label {
  display: grid; grid-template-columns: 30px minmax(0, 1fr);
  align-items: center; gap: 10px;
  padding: 8px 12px 8px 0; line-height: 1.3; min-width: 0;
  border-top: 1px solid var(--line-soft);
}
.tt__diff {
  font-family: var(--font-sans); font-size: 11px; color: var(--muted);
  text-align: right; font-variant-numeric: tabular-nums;
}
.tt__diff.is-home { color: var(--accent-strong); font-size: 10px; font-weight: 600; }
.tt__ident { display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
.tt__name { display: flex; align-items: baseline; gap: 5px; font-size: 13.5px; font-weight: 600; white-space: nowrap; }
.tt__code { font-family: var(--font-sans); font-size: 9px; letter-spacing: 0.06em; color: var(--accent-strong); }
.tt__city { font-size: 10.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tt__ident .tag--off { align-self: flex-start; margin-top: 2px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.tt__cell {
  position: relative;
  border: 0; border-radius: 3px; padding: 10px 0 9px;
  background: var(--out-fill); color: #939DAF;
  font-family: var(--font-sans); font-size: 12px; font-variant-numeric: tabular-nums;
  text-align: center;
}
.tt__cellface { position: relative; z-index: 1; pointer-events: none; display: block; }
.tt__min { font-size: 8px; line-height: 1; vertical-align: super; opacity: 0.75; margin-left: 1px; }

/* 서머타임이 시작·종료되는 칸 — 선택 상자(주황)와 헷갈리지 않도록 남색 점선으로 둔다 */
.tt__cell.is-dstshift { box-shadow: inset 2px 0 0 var(--work-text); }
.tt__cell.is-dstshift::after {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 2px;
  background: repeating-linear-gradient(var(--surface) 0 2px, transparent 2px 4px);
  z-index: 1; pointer-events: none;
}

/* 30분 단위 클릭 영역 — 칸을 좌(:00) · 우(:30)로 나눈다 */
.tt__half {
  position: absolute; top: 0; bottom: 0; width: 50%;
  border: 0; padding: 0; margin: 0; background: transparent;
  cursor: pointer; z-index: 2;
}
.tt__half:first-of-type { left: 0; border-radius: 3px 0 0 3px; }
.tt__half:last-of-type { left: 50%; border-radius: 0 3px 3px 0; }
.tt__half:hover { background: rgba(0, 0, 0, 0.08); }
.tt__half.is-sel { background: rgba(243, 115, 33, 0.16); }

.tt__daymark { display: block; font-size: 9px; line-height: 1.15; color: var(--accent-strong); font-weight: 600; }

.cell--core { background: var(--core-fill); color: #FFF3F0; font-weight: 500; }
/* 코어타임에 시작하지만 종료가 창을 넘어가는 칸 — 띠는 같은 붉은색으로 유지한다 */
.cell--partial { background: var(--core-fill); color: #FFF3F0; font-weight: 500; }
.cell--agree {
  background-color: var(--agree-fill); color: #9E3A26;
  background-image: repeating-linear-gradient(135deg, rgba(200, 58, 36, 0.28) 0 2px, transparent 2px 5px);
}
.cell--work { background: var(--work-fill); color: var(--work-text); }
.cell--out { background: var(--out-fill); color: #939DAF; }
.cell--off {
  background-color: var(--off-fill); color: #6E7A8C;
  background-image: repeating-linear-gradient(135deg, rgba(0, 0, 0, 0.12) 0 2px, transparent 2px 5px);
}

.tt__marker {
  position: absolute; pointer-events: none;
  border: 2px solid var(--accent); border-radius: 6px;
  box-shadow: 0 0 0 3px rgba(243, 115, 33, 0.14);
  z-index: 3;
}
.tt__foot { margin-top: 12px; font-size: 11.5px; color: var(--muted); }

.empty {
  padding: 44px 24px; text-align: center; margin-bottom: 22px;
  border: 1px dashed var(--line); border-radius: var(--radius-lg); background: var(--surface);
}
.empty__title { font-weight: 600; margin-bottom: 6px; }
.empty__text { color: var(--muted); font-size: 13.5px; }

/* ── 하단 패널 — 메일 초안 위, 추천시간 기준 아래 ─────────── */

.panels {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: clamp(16px, 2vw, 24px);
  align-items: start;
}

.panel {
  background: var(--surface); border: 1px solid var(--line-soft);
  border-radius: var(--radius-lg); padding: 18px;
  display: flex; flex-direction: column; gap: 10px;
  box-shadow: var(--shadow);
}
.panel__head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.panel__eyebrow { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.panel__eyebrow--lg {
  font-size: 16px; font-weight: 600; letter-spacing: -0.01em;
  text-transform: none; color: var(--text); margin-bottom: 4px;
}
.panel__when { font-size: 15px; font-weight: 600; margin-top: 3px; }
.panel__when .mono { color: var(--core); }
.panel__whenbase { font-size: 11.5px; font-weight: 400; color: var(--muted); }
.panel__when--empty { color: var(--muted); font-weight: 400; font-size: 13px; }
.panel__note { font-size: 12.5px; color: var(--muted); line-height: 1.65; }
.panel__note--lead { margin-top: 4px; max-width: 52ch; }
.panel__note strong { color: var(--text-dim); }
.panel__note em { color: var(--text-dim); font-style: normal; }

.modeswitch {
  display: inline-flex; padding: 3px; gap: 3px; flex: 0 0 auto;
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px;
}
.modeswitch__btn {
  border: 0; background: none; padding: 5px 12px; border-radius: 999px;
  font-size: 12px; color: var(--muted); cursor: pointer;
  transition: background 0.16s ease, color 0.16s ease;
}
.modeswitch__btn:hover { color: var(--text-dim); }
.modeswitch__btn.is-active { background: var(--accent); color: #fff; font-weight: 500; }

/* 메일 */

.mail__label { font-size: 11.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.mail__subject, .mail__body {
  width: 100%; padding: 10px 12px;
  background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius);
  color: var(--text); font-family: var(--font-mono); font-size: 14px; line-height: 1.75; resize: vertical;
}
.mail__subject:focus, .mail__body:focus { border-color: var(--accent); background: #fff; }
.mail__body { white-space: pre; overflow-x: auto; }
.mail__actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.copybtn {
  width: 100%; padding: 11px 14px; border-radius: var(--radius);
  border: 1px solid var(--accent); background: var(--accent);
  color: #fff; font-size: 13.5px; font-weight: 600; cursor: pointer;
  transition: background 0.16s ease, border-color 0.16s ease;
}
.copybtn:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
.ghostbtn {
  padding: 10px 14px; border-radius: var(--radius);
  border: 1px solid var(--line); background: var(--surface);
  color: var(--text-dim); font-size: 12.5px; cursor: pointer;
}
.ghostbtn:hover { border-color: #B9C3D3; color: var(--text); }

.tokens { display: flex; flex-wrap: wrap; gap: 5px; }
.token {
  font-family: var(--font-sans); font-size: 10.5px; padding: 2px 6px; border-radius: 4px;
  background: var(--surface-2); color: var(--accent-strong); border: 1px solid var(--line-soft);
}

/* 기준표 */

.notice {
  padding: 10px 12px; border-radius: var(--radius);
  border: 1px solid rgba(243, 115, 33, 0.35); border-left: 2px solid var(--accent);
  background: var(--accent-soft); font-size: 12px; color: var(--text-dim);
}
.notice strong { color: var(--accent-strong); display: block; margin-bottom: 2px; }

.tablewrap { overflow-x: auto; }
.ptable { width: 100%; font-size: 14px; min-width: 440px; }
.ptable th {
  text-align: left; font-size: 11.5px; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--muted); font-weight: 600; padding: 8px 10px 8px 0; border-bottom: 1px solid var(--line);
  vertical-align: bottom;
}
.ptable td { padding: 12px 10px 12px 0; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
.ptable tbody tr:last-child td { border-bottom: 0; }
.ptable .is-current { background: rgba(243, 115, 33, 0.06); }
.ptable .is-excluded .mono { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; }
.ptable td .pill { display: inline-block; margin-top: 5px; }

.dtable__name { display: block; font-weight: 500; font-size: 14.5px; }
.dtable__badge { font-family: var(--font-sans); font-size: 10.5px; letter-spacing: 0.06em; color: var(--accent-strong); }
.dtable__code { display: block; font-family: var(--font-sans); font-size: 11px; color: var(--muted); letter-spacing: 0.04em; }
.dtable__day { display: block; font-size: 13px; color: var(--muted); margin-top: 3px; }

/* ── 회의 추천시간 기준 패널 ───────────────────────────────── */
.psec__intro {
  margin: 0 0 16px; font-size: 12.5px; line-height: 1.7; color: var(--muted);
}
.psec__title {
  margin: 26px 0 4px; font-size: 14px; font-weight: 600; color: var(--text);
}
.psec__title:first-of-type { margin-top: 18px; }
.psec__desc { margin: 0 0 12px; font-size: 12.5px; line-height: 1.6; color: var(--muted); }

.ptable__who { font-weight: 500; font-size: 13.5px; padding-right: 14px; white-space: nowrap; }

/* 한 조합 안에서 법인별 시각을 한 줄씩 */
.ptime { display: block; margin-bottom: 5px; font-size: 13px; }
.ptime:last-child { margin-bottom: 0; }
.ptime__who { color: var(--muted); margin-right: 6px; }
.ptime__at { color: var(--text-dim); }
.ptime__at--dst { display: block; margin-left: 0; color: var(--muted); font-size: 12.5px; }

/* 원문 기준표는 접어 둔다 */
.psec__source { margin-top: 26px; border-top: 1px solid var(--line-soft); padding-top: 14px; }
.psec__source > summary {
  cursor: pointer; font-size: 12.5px; color: var(--muted); list-style: none;
}
.psec__source > summary::-webkit-details-marker { display: none; }
.psec__source > summary::before { content: '▸ '; color: var(--accent-strong); }
.psec__source[open] > summary::before { content: '▾ '; }
.psec__source > summary:hover { color: var(--text-dim); }
.psec__source .tablewrap { margin-top: 12px; }

.pill { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.pill--agree { background: rgba(200, 58, 36, 0.1); color: var(--core); border: 1px solid rgba(200, 58, 36, 0.3); }

/* ── 푸터 ───────────────────────────────────────────────── */

.footer {
  border-top: 1px solid var(--line); color: var(--muted); font-size: 12.5px;
  display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 10px 24px;

.footer__views {

  background: var(--surface); border: 1px solid var(--line-soft); border-radius: 999px;
}
.footer__copy { font-family: var(--font-sans); font-size: 11.5px; color: var(--muted); }
.footer__mail { color: var(--accent-strong); text-decoration: none; border-bottom: 1px solid rgba(243, 115, 33, 0.4); }
.footer__mail:hover { color: var(--accent); }

@media (max-width: 1180px) {

  .field--chips { grid-column: 1 / -1; }
}

@media (max-width: 640px) {
  .topbar__sub { display: none; }

  .tt__grid { grid-template-columns: 150px repeat(24, minmax(26px, 1fr)); min-width: 820px; }
}

@media (prefers-reduced-motion: reduce) {

  mode: 'auto',
  namespace: 'hanwhavision-coretime',   // 다른 사이트와 겹치지 않는 이름
  workerUrl: 'https://coretime-counter.ljm6749.workers.dev',   // 배포한 Cloudflare Worker 주소

(function (global) {
  'use strict';

  var SESSION_KEY = 'hv-coretime:counted';

  function pad(n) { return (n < 10 ? '0' : '') + n; }

  function todayKey() {
    var d = new Date();
    return d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate());
  }

  function log(msg, extra) {
    try { global.console.warn('[view-counter] ' + msg, extra === undefined ? '' : extra); } catch (err) { /* noop */ }
  }

  /** 같은 세션에서 새로고침할 때마다 숫자가 오르지 않도록 한 번만 집계 */
  function firstVisitInSession() {
    try {
      if (global.sessionStorage.getItem(SESSION_KEY)) return false;
      global.sessionStorage.setItem(SESSION_KEY, '1');
      return true;
    } catch (err) {
      return true;
    }
  }

  /** 응답이 없어도 화면이 멈추지 않도록 제한 시간을 둔다 */
  function withTimeout(promise, ms) {
    return new Promise(function (resolve, reject) {
      var done = false;
      var timer = global.setTimeout(function () {
        if (!done) { done = true; reject(new Error('timeout ' + ms + 'ms')); }
      }, ms);
      promise.then(function (value) {
        if (!done) { done = true; global.clearTimeout(timer); resolve(value); }
      }, function (err) {
        if (!done) { done = true; global.clearTimeout(timer); reject(err); }
      });
    });
  }

  function getJSON(url, ms) {
    return withTimeout(
      global.fetch(url, { cache: 'no-store', mode: 'cors' }).then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      }),
      ms
    );
  }

  /** 서비스마다 값을 담는 키 이름이 달라 하나로 맞춰준다 */
  function valueOf(payload) {
    if (!payload || typeof payload !== 'object') return null;
    var candidates = [payload.value, payload.count, payload.data && payload.data.up_count, payload.data && payload.data.count];
    for (var i = 0; i < candidates.length; i += 1) {
      if (typeof candidates[i] === 'number') return candidates[i];
    }
    return null;
  }

  function pairRequest(totalUrl, todayUrl, ms) {
    return Promise.all([getJSON(totalUrl, ms), getJSON(todayUrl, ms)]).then(function (results) {
      var total = valueOf(results[0]);
      var today = valueOf(results[1]);
      if (total === null || today === null) throw new Error('unexpected payload');
      return { total: total, today: today };
    });
  }

  /* ── 제공자 목록 (앞에서부터 시도하고 실패하면 다음으로 넘어간다) ───────── */

  var PROVIDERS = [
    {
      name: 'worker',
      available: function (cfg) { return !!cfg.workerUrl; },
      run: function (cfg, counting, ms) {
        var base = String(cfg.workerUrl).replace(/\/+$/, '');   // 끝의 / 는 떼고 붙인다
        return getJSON(base + (counting ? '/?hit=1' : '/'), ms).then(function (data) {
          if (!data || typeof data.total !== 'number') throw new Error('unexpected payload');
          return { total: data.total, today: typeof data.today === 'number' ? data.today : 0 };
        });
      }
    },
    {
      name: 'abacus',
      available: function () { return true; },
      run: function (cfg, counting, ms) {
        var base = 'https://abacus.jasoncameron.dev/' + (counting ? 'hit' : 'get') + '/' + cfg.namespace + '/';
        return pairRequest(base + 'total', base + todayKey(), ms);
      }
    },
    {
      name: 'counterapi',
      available: function () { return true; },
      run: function (cfg, counting, ms) {
        var base = 'https://api.counterapi.dev/v1/' + cfg.namespace + '/';
        var tail = counting ? '/up' : '';
        return pairRequest(base + 'total' + tail, base + todayKey() + tail, ms);
      }
    }
  ];

  function runChain(list, cfg, counting, ms) {
    if (!list.length) return Promise.reject(new Error('no provider left'));
    var provider = list[0];
    return provider.run(cfg, counting, ms).then(function (data) {
      return { data: data, provider: provider.name };
    }, function (err) {
      log(provider.name + ' 실패 → ' + (err && err.message ? err.message : err));
      return runChain(list.slice(1), cfg, counting, ms);
    });
  }

  global.ViewCounter = {
    /** @param {Function} onCount  { today, total } 를 받아 화면에 표시 */
    load: function (onCount) {
      var cfg = global.VIEW_COUNTER || {};
      if (cfg.mode === 'off') return;
      if (!global.fetch || !global.Promise) {
        log('이 브라우저는 fetch 를 지원하지 않습니다.');
        return;
      }

      var chain = PROVIDERS.filter(function (p) {
        if (cfg.mode === 'worker') return p.name === 'worker' && p.available(cfg);
        return p.available(cfg);
      });

      if (!chain.length) {
        log("mode 가 'worker' 인데 workerUrl 이 비어 있습니다.");
        return;
      }

      var counting = firstVisitInSession();
      var ms = cfg.timeoutMs || 6000;

      runChain(chain, cfg, counting, ms).then(function (result) {
        onCount(result.data);
      }).catch(function () {
        log('모든 카운터 서비스 호출에 실패했습니다. 사내망 차단이거나 서비스 장애일 수 있습니다. '
          + 'worker/view-counter.js 를 Cloudflare 에 배포한 뒤 workerUrl 을 지정하면 가장 안정적입니다.');
      });
    }
  };

      label: p.label, note: p.note, rotation: p.rotation,
      windows: p.windows,
      baseTz: global.CORE_TIME_BASE_TZ

    var q = n === 4 ? 'Q1' : 'Q' + (n + 1);
    var year = n === 4 ? policy.year + 1 : policy.year;
    var p = global.CORE_TIME_POLICY[q];
    return {
      quarter: q, year: year, label: p.label, note: p.note, rotation: p.rotation,
      windows: p.windows, baseTz: policy.baseTz

  }

   * 코어타임 창이 회의 '시작 시각'을 담고 있는가 (창은 정책 기준 시간대로 정의)
   * 빨간 띠는 소요시간과 무관하게 창 전체(예: 한국 19~22시)로 고정되어야 하므로
   * 색을 정하는 판정에는 시작 시각만 쓴다.

    var start = TZ.zonedParts(entity.tz, utcStart);
    var end = TZ.zonedParts(entity.tz, utcStart + durationMin * 60000);
    var holiday = global.holidayOf(entity, dateKey(start));
    var s = start.decimal;
    var e = s + durationMin / 60;
    var notes = [];
    var status;

    var windows = activeWindows(policy, utcStart);
    var coreFrom = TZ.zonedParts(policy.baseTz, utcStart).decimal;
    var coreTo = coreFrom + durationMin / 60;
    var fullyInCore = windows.some(function (w) { return windowContains(w, coreFrom, coreTo); });
    var excludedReason = null;
    windows.forEach(function (w) {
      if (w.excluded && w.excluded[entity.id]) excludedReason = w.excluded[entity.id];
    });
    /*
     * 근무시간 음영은 '회의 시작 시각'이 근무시간 안에 있는지로 판단한다.
     * 종료 시각까지 따지면 09~18시 근무라도 마지막 칸이 17시에서 끊겨,
     * 시간표에서 근무시간이 한 시간 짧아 보인다. 끝 시각은 경계로 포함한다.
     */
    var inWork = entity.workdays.indexOf(start.weekday) !== -1 &&
                 s >= entity.work[0] && s <= entity.work[1];

    if (entity.workdays.indexOf(start.weekday) === -1) {
      status = 'off';
      notes.push('주말');
    } else if (holiday) {
      status = 'off';
      notes.push('공휴일 · ' + holiday.name + (holiday.tentative ? ' (잠정)' : ''));
    } else if (windows.length && excludedReason) {
      status = 'agree';
      notes.push('코어타임 적용 제외 — ' + excludedReason);
    } else if (windows.length) {
      status = fullyInCore ? 'core' : 'partial';
      notes.push(windows.map(function (w) { return w.name; }).join(' · '));
      if (!fullyInCore) notes.push('회의 종료 시각이 코어타임을 넘어감');
      if (!inWork) notes.push('현지 정규 근무시간 밖');
    } else if (inWork) {
      status = 'work';
      if (e > entity.work[1]) notes.push('현지 근무 종료 시각 이후까지 이어짐');
    } else {
      status = 'out';
      notes.push(s < 6 ? '심야' : '근무시간 밖');
    }

    if (entity.shortDay && start.weekday === entity.shortDay.weekday &&
        e > entity.shortDay.until && status !== 'off') {
      notes.push(entity.shortDay.reason);
    }
    if (entity.lunch && status !== 'off' && overlaps(s, e, entity.lunch[0], entity.lunch[1])) {
      notes.push('현지 점심시간');
    }

    /*
     * 메모 문구는 '적합 / 협의 필요' 두 가지뿐이다.
     *   적합      회의 전체가 현지 근무시간 또는 코어타임 안에 들어옴
     *   협의 필요 휴무일이거나, 그 밖의 시간이 조금이라도 포함됨
     *
     * 근무시간과 코어타임 사이에 한 시간 이하의 틈이 있으면 이어진 것으로 본다.
     * 한국 Q1·Q3 의 18~19시가 그런 경우로, 규칙에서는 벗어나지만 퇴근 직후 저녁이라
     * 회의 참여에 무리가 없다고 보고 '적합'으로 처리한다.
     * 코어타임 적용 제외 시간(현지 새벽·심야)은 규정상 협의 대상이라 구간에서 뺀다.
     */
    var BRIDGE_MS = 60 * 60000;
    var utcEnd = utcStart + durationMin * 60000;
    var spans = [];

    /** 소수 시각(9.5 → 09:30)을 그 날짜의 절대 시각으로 */
    function wallAt(tz, parts, decimal) {
      return TZ.wallToUtc(tz, parts.year, parts.month, parts.day,
        Math.floor(decimal), Math.round((decimal % 1) * 60));
    }

    // 회의가 자정을 넘길 수 있으므로 전날 · 당일 · 다음날 구간을 모두 만들어 둔다
    [-1, 0, 1].forEach(function (offset) {
      var at = utcStart + offset * 86400000;

      var day = TZ.zonedParts(entity.tz, at);
      if (entity.workdays.indexOf(day.weekday) !== -1) {
        var workStart = wallAt(entity.tz, day, entity.work[0]);
        spans.push([workStart, workStart + (entity.work[1] - entity.work[0]) * 3600000]);
      }

      (policy.effectiveWindows || policy.windows).forEach(function (w) {
        if (w.excluded && w.excluded[entity.id]) return;
        var tz = windowTz(policy, w);
        var coreStart = wallAt(tz, TZ.zonedParts(tz, at), w.from);
        spans.push([coreStart, coreStart + (w.to - w.from) * 3600000]);
      });
    });

    spans.sort(function (a, b) { return a[0] - b[0]; });
    var merged = [];
    spans.forEach(function (sp) {
      var last = merged[merged.length - 1];
      if (last && sp[0] - last[1] <= BRIDGE_MS) last[1] = Math.max(last[1], sp[1]);
      else merged.push([sp[0], sp[1]]);
    });

    var fit = status !== 'off' && merged.some(function (m) {
      return utcStart >= m[0] && utcEnd <= m[1];
    });

    return {
      id: entity.id,
      entity: entity,
      status: status,
      fit: fit,
      statusLabel: STATUS_LABEL[status],
      start: start,
      end: end,
      holiday: holiday,
      windows: windows,
      excludedReason: excludedReason,
      notes: notes
    };
  }

  /** 여러 법인의 상태를 한 번에 */
  function evaluateSlot(entities, policy, utcStart, durationMin) {
    var rows = entities.map(function (entity) {
      return evaluateEntity(entity, policy, utcStart, durationMin);
    });
    var counts = { core: 0, partial: 0, agree: 0, work: 0, out: 0, off: 0 };
    rows.forEach(function (r) { counts[r.status] += 1; });
    return {
      utcStart: utcStart,
      durationMin: durationMin,
      rows: rows,
      counts: counts,
      allCore: counts.core === rows.length,
      anyCore: counts.core > 0,
      feasible: counts.out === 0 && counts.off === 0
    };
  }

  /**
   * 홈 법인 기준으로 24시간을 1시간 단위로 평가한다.
   * startHour 를 주면 그 시각부터 24칸을 만든다. (코어타임을 가운데 두기 위한 용도)
   * @param {Object} opts date / baseTz / entities / durationMin / startHour
   */
  function planDay(opts) {
    var TZ = global.TZ;
    var p = opts.date.split('-');
    var year = +p[0], month = +p[1], day = +p[2];
    var policy = resolvePolicy(policyFor(year, month),
      opts.entities.map(function (e) { return e.id; }), opts.date);
    var startHour = opts.startHour || 0;
    var slots = [];

    /*
     * 첫 칸의 절대 시각만 벽시계로 구하고, 나머지 23칸은 정확히 1시간씩 더한다.
     * 칸마다 벽시계 시각을 다시 변환하면 서머타임이 시작되는 날(없는 시각 02:00 등)에
     * 같은 순간이 두 칸에 겹쳐 찍히므로, 절대 시각을 기준으로 24시간을 이어 붙인다.
     * 각 법인 행에 표시되는 숫자는 그 순간을 해당 시간대로 환산한 값이라
     * 나라별 서머타임 적용 기간이 달라도 자동으로 맞는다.
     */
    var anchorUtc = TZ.wallToUtc(opts.baseTz, year, month, day, startHour, 0);

    for (var i = 0; i < 24; i++) {
      var utcStart = anchorUtc + i * 3600000;
      var slot = evaluateSlot(opts.entities, policy, utcStart, opts.durationMin);
      slot.index = i;
      slot.offsetMin = i * 60;             // 표 시작점부터의 경과 분
      slot.hourLabel = TZ.zonedParts(opts.baseTz, utcStart).hour;   // 홈 법인의 실제 현지 시각
      slots.push(slot);
    }

    return {
      policy: policy, slots: slots, startHour: startHour,
      anchorUtc: anchorUtc, nextPolicy: nextQuarterOf(policy)
    };
  }

  /**
   * 코어타임 창이 24칸의 가운데에 오도록 시작 시각을 계산한다.
   * 홈 법인이 한국보다 많이 뒤처진 지역이면 음수가 나오는데(= 전날 저녁부터 시작),
   * 이 값을 24로 감싸면 표가 통째로 하루 뒤로 밀리므로 그대로 둔다.
   */
  function centeredStartHour(policy, baseTz, dateStr) {
    var TZ = global.TZ;
    var win = (policy.effectiveWindows || policy.windows)[0];
    if (!win) return 6;                       // 추천시간이 없으면 06시부터 하루를 보여준다
    var p = dateStr.split('-');
    var startUtc = TZ.wallToUtc(windowTz(policy, win), +p[0], +p[1], +p[2],
      Math.floor(win.from), Math.round((win.from % 1) * 60));
    var localStart = TZ.zonedParts(baseTz, startUtc).decimal;
    var length = win.to - win.from;
    return Math.round(localStart - (24 - length) / 2);
  }

  global.Scheduler = {
    planDay: planDay,
    resolvePolicy: resolvePolicy,
    centeredStartHour: centeredStartHour,
    isTrilateral: isTrilateral,
    policyFor: policyFor,
    nextQuarterOf: nextQuarterOf,
    evaluateSlot: evaluateSlot,
    evaluateEntity: evaluateEntity,
    activeWindows: activeWindows,
    fixedRuleFor: fixedRuleFor,
    autoWindow: autoWindow,
    dateKey: dateKey,
    STATUS_LABEL: STATUS_LABEL
  };
})(window);

</script>
<script>
/**
 * 회의 소집 메일 템플릿
 *
 * 아래 DEFAULT_TEMPLATES 의 문구가 화면에 그대로 나오고,
 * 중괄호 토큰은 선택한 회의 시각으로 자동 치환됩니다.
 * 화면의 본문 창에서 바로 고쳐 쓴 뒤 복사할 수 있습니다.
 *
 *   {{일시}}     2026년 8월 20일(목) 19:00–20:00 (한국 기준)
 *   {{일시표}}   법인별 현지시각 목록 (여러 줄)
 *   {{소요시간}} 60분
 *   {{참여법인}} 한국, 북미 동부, 유럽 …
 *   {{코어타임}} 적용된 코어타임 창 이름
 *   {{분기}}     2026년 3분기
 */
(function (global) {
  'use strict';

  var TZ = global.TZ;
  var EN_DAY = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

  var DEFAULT_TEMPLATES = {
    ko: {
      subject: '[invitation] OOO 회의 소집 안내 – {{일시}}',
      body: [
        '안녕하세요, [ 본인 소속, 이름, 직위 ]입니다.',
        '',
        '아래와 같이 [ 회의 제목 ]을 소집합니다.',
        '본 회의에서는 [ 주요 논의내용 요약 ] 에 대한 논의를 진행할 예정입니다.',
        '',
        '1. 회의 개요',
        '- 일시 : {{일시}}',
        '- 장소 : Teams 미팅 (접속링크 삽입)',
        '- 참석자:',
        '- 목적:',
        '',
        '2. 주요 아젠다',
        '(1)',
        '(2)',
        '',
        '3. 회의 관련 자료',
        '- [사전 공유 자료 또는 링크]',
        '',
        '',
        '감사합니다.'
      ].join('\n')
    },
    en: {
      subject: '[invitation] [ Meeting Name ] – {{일시}}',
      body: [
        'Dear colleagues,',
        '',
        'I hope this email finds you well.',
        'You are invited to the [ Meeting Title ] below.',
        'In this session, we will discuss [ brief summary of key discussion points ].',
        '',
        '1. Meeting Overview',
        '- Date & Time: {{일시}}',
        '- Location: Teams Meeting (Meeting link attached)',
        '- Attendees:',
        '- Purpose:',
        '',
        '2. Key Agenda',
        '(1)',
        '(2)',
        '',
        '3. Reference Link',
        '- [ Materials or links to review ]',
        '',
        'Best regards,'
      ].join('\n')
    }
  };

  /** 한글은 두 칸으로 계산해 고정폭 정렬을 맞춘다 */
  function padRight(text, width) {
    var len = 0;
    for (var i = 0; i < text.length; i++) len += text.charCodeAt(i) > 0x2E80 ? 2 : 1;
    return text + new Array(Math.max(1, width - len + 1)).join(' ');
  }

  function timeRange(row) {
    return TZ.pad(row.start.hour) + ':' + TZ.pad(row.start.minute) + '–' +
           TZ.pad(row.end.hour) + ':' + TZ.pad(row.end.minute);
  }

  function rowLine(row, lang) {
    var s = row.start;
    var name = lang === 'en' ? row.entity.legal : row.entity.name + '(' + row.entity.code + ')';
    var date = lang === 'en'
      ? s.month + '/' + s.day + ' ' + EN_DAY[s.weekday]
      : s.month + '/' + s.day + '(' + TZ.DAY_KO[s.weekday] + ')';
    var tail = '';
    if (row.status === 'off') tail = lang === 'en' ? '  * local holiday' : '  ※ 현지 휴무';
    else if (row.status === 'out') tail = lang === 'en' ? '  * outside business hours' : '  ※ 근무시간 외';
    else if (row.status === 'agree') tail = lang === 'en' ? '  * outside core hours - by agreement' : '  ※ 코어타임 제외 · 협의 필요';
    return '   · ' + padRight(name, lang === 'en' ? 34 : 20) + date + ' ' + timeRange(row) + tail;
  }

  function tokens(ctx, lang) {
    var I = global.I18N;
    if (!ctx.rows || !ctx.rows.length || !ctx.baseParts) {
      return {
        '{{일시}}': I.STRINGS[lang]['mail.phTime'],
        '{{소요시간}}': ctx.durationMin ? durationText(ctx.durationMin, lang) : I.STRINGS[lang]['mail.phDuration'],
        '{{참여법인}}': I.STRINGS[lang]['mail.phEntities'],
        '{{일시표}}': '   ' + I.STRINGS[lang]['mail.phEntities'],
        '{{코어타임}}': lang === 'en' ? 'the designated Global Core Hours' : '글로벌 코어타임',
        '{{분기}}': lang === 'en'
          ? ctx.policy.year + ' ' + ctx.policy.quarter
          : ctx.policy.year + '년 ' + ctx.policy.quarter.slice(1) + '분기'
      };
    }
    var b = ctx.baseParts;
    var when = lang === 'en'
      ? b.year + '-' + TZ.pad(b.month) + '-' + TZ.pad(b.day) + ' (' + EN_DAY[b.weekday] + ') ' +
        ctx.baseRange + ' ' + (ctx.base.nameEn || ctx.base.legal) + ' time'
      : b.year + '년 ' + b.month + '월 ' + b.day + '일(' + TZ.DAY_KO[b.weekday] + ') ' +
        ctx.baseRange + ' (' + ctx.base.name + ' 기준)';

    return {
      '{{일시}}': when,
      '{{소요시간}}': ctx.durationMin ? durationText(ctx.durationMin, lang) : global.I18N.STRINGS[lang]['mail.phDuration'],
      '{{참여법인}}': ctx.rows.map(function (r) {
        return lang === 'en' ? r.entity.legal : r.entity.name;
      }).join(', '),
      '{{일시표}}': ctx.rows.map(function (r) { return rowLine(r, lang); }).join('\n'),
      '{{코어타임}}': lang === 'en' ? 'the designated Global Core Hours' : '글로벌 코어타임',
      '{{분기}}': lang === 'en'
        ? ctx.policy.year + ' ' + ctx.policy.quarter
        : ctx.policy.year + '년 ' + ctx.policy.quarter.slice(1) + '분기'
    };
  }

  /** 60 → '1시간' / '1 hour' */
  function durationText(min, lang) {
    var h = Math.floor(min / 60);
    var half = min % 60 >= 30;
    if (!h) return lang === 'en' ? '30 min' : '30분';
    var plural = lang === 'en' && h > 1 ? 's' : '';
    if (lang === 'en') return h + ' hour' + plural + (half ? ' 30 min' : '');
    return h + '시간' + (half ? ' 30분' : '');
  }

  function fill(text, map) {
    return Object.keys(map).reduce(function (acc, token) {
      return acc.split(token).join(map[token]);
    }, text);
  }

  global.MailTemplate = {
    DEFAULTS: DEFAULT_TEMPLATES,
    /** 저장된 문구에 회의 시각을 채워 완성본을 만든다 */
    render: function (ctx, lang) {
      var map = tokens(ctx, lang);
      return {
        subject: fill(DEFAULT_TEMPLATES[lang].subject, map),
        body: fill(DEFAULT_TEMPLATES[lang].body, map)
      };
    }
  };
})(window);

</script>

/**

 */
(function (global) {
  'use strict';

  var TZ = global.TZ;
  var ENTITIES = global.ENTITIES;
  var LANG_KEY = 'hv-coretime:lang';
  var MONTH_EN = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

  function T(key, vars) { return global.I18N.t(key, vars); }
  function isEn() { return global.I18N.lang() === 'en'; }
  function entityName(entity) { return isEn() ? (entity.nameEn || entity.legal) : entity.name; }
  function entityCity(entity) { return isEn() ? (entity.cityEn || entity.city) : entity.city; }
  /** 셀 메모는 '적합 / 협의 필요' 두 가지만 쓴다 */
  function statusLabel(row) { return T(row.fit ? 'status.fit' : 'status.talk'); }

  /** 코드가 표기 이름과 같으면(영문 India 등) 같은 말을 두 번 쓰지 않는다 */
  function entityCode(entity) { return entity.code === entityName(entity) ? '' : entity.code; }

  /** 도시명이 법인 표기와 같으면(영문 Singapore 등) 한 번만 쓴다 */
  function cityLine(entity) { return entityCity(entity) === entityName(entity) ? '' : entityCity(entity); }

  /** 90 → '1시간 30분' / '1 hour 30 min' */
  function durationLabel(min) {

    var half = min % 60 >= 30;
    if (!h) return T('duration.half');

    return T(half ? 'duration.hourHalf' : 'duration.hour', vars);

  function dayName(weekday) { return (isEn() ? TZ.DAY_EN : TZ.DAY_KO)[weekday]; }
  var byId = {};
  ENTITIES.forEach(function (e) { byId[e.id] = e; });

  /** 코어타임 기준표에서 제외할 법인 (시간표에는 그대로 표시) */

    dayTabs: document.getElementById('dayTabs'),
    timetable: document.getElementById('timetable'),

  };

  var state = {

    baseId: '',

    selectedMinutes: null,     // 시간표 첫 칸부터의 경과 분 (0 ~ 1440)
    startHour: 0,              // 시간표 첫 칸의 시각
    plan: null,
    lang: 'ko',
    mailLang: 'ko',
    slideDir: null,            // 날짜 이동 시 시간표 슬라이드 방향

  /* ── 날짜 유틸 ──────────────────────────────────────────── */

  function todayIn(tz) {

    return p.year + '-' + TZ.pad(p.month) + '-' + TZ.pad(p.day);
  }

  function shiftDate(dateStr, days) {

    d.setUTCDate(d.getUTCDate() + days);
    return d.getUTCFullYear() + '-' + TZ.pad(d.getUTCMonth() + 1) + '-' + TZ.pad(d.getUTCDate());

  function weekdayOf(dateStr) {

    return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])).getUTCDay();
  }

  function fmtDate(dateStr) {
    var p = dateStr.split('-');
    var wd = weekdayOf(dateStr);
    if (isEn()) return MONTH_EN[+p[1] - 1] + ' ' + (+p[2]) + ' (' + TZ.DAY_EN[wd] + ')';
    return (+p[1]) + '월 ' + (+p[2]) + '일(' + TZ.DAY_KO[wd] + ')';
  }

  /* ── 초기화 ─────────────────────────────────────────────── */

  function init() {
    state.lang = detectLang();
    state.mailLang = state.lang;
    global.I18N.setLang(state.lang);
    applyStaticText();

    el.langSwitch.addEventListener('click', function (event) {
      var btn = event.target.closest('[data-ui-lang]');
      if (!btn) return;
      setLang(btn.getAttribute('data-ui-lang'));
    });

    el.base.appendChild(placeholderOption());
    ENTITIES.forEach(function (e) {
      var opt = document.createElement('option');
      opt.value = e.id;
      opt.textContent = entityName(e) + (entityCode(e) ? ' (' + entityCode(e) + ')' : '');
      el.base.appendChild(opt);
    });
    el.base.value = '';

    el.duration.appendChild(placeholderOption());
    global.DURATIONS.forEach(function (min) {
      var opt = document.createElement('option');
      opt.value = String(min);
      opt.setAttribute('data-duration', String(min));
      opt.textContent = durationLabel(min);
      el.duration.appendChild(opt);
    });
    el.duration.value = '';

    buildChips();

    el.date.addEventListener('change', function () {
      state.date = el.date.value;
      state.selectedMinutes = null;
      update();
    });
    el.base.addEventListener('change', function () {
      state.baseId = el.base.value;
      // 내 소속은 회의 참여자에 자동으로 포함시킨다 (원하면 칩에서 해제 가능)
      if (state.baseId && state.participants.indexOf(state.baseId) === -1) {
        state.participants.push(state.baseId);
        syncChips();
      }
      state.selectedMinutes = null;
      update();
    });
    el.duration.addEventListener('change', function () {
      state.durationMin = el.duration.value ? +el.duration.value : null;
      state.selectedMinutes = null;
      update();
    });
    el.controls.addEventListener('click', function (event) {
      var btn = event.target.closest('[data-select]');
      if (!btn) return;
      state.participants = btn.getAttribute('data-select') === 'all'
        ? ENTITIES.map(function (e) { return e.id; })
        : [];
      syncChips();
      update();
    });
    el.dayTabs.addEventListener('click', function (event) {
      var tab = event.target.closest('[data-date]');
      if (!tab) return;
      goToDate(tab.getAttribute('data-date'));
    });
    el.timetable.addEventListener('click', function (event) {
      var nav = event.target.closest('[data-shift]');
      if (nav) { goToDate(shiftDate(state.date, +nav.getAttribute('data-shift'))); return; }
      var half = event.target.closest('[data-minutes]');
      if (!half) return;
      state.selectedMinutes = +half.getAttribute('data-minutes');
      renderTimetable();
      renderMail();
    });

    if (global.ViewCounter) {
      global.ViewCounter.load(function (counts) {
        state.views = counts;
        renderViewCounter();
      });
    }

    var resizeTimer;
    global.addEventListener('resize', function () {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(positionMarker, 150);
    });

    update();
  }

  function detectLang() {
    try {
      var saved = global.localStorage.getItem(LANG_KEY);
      if (saved === 'ko' || saved === 'en') return saved;
    } catch (err) { /* 저장소 접근 불가 */ }
    var nav = (global.navigator.language || 'ko').toLowerCase();
    return nav.indexOf('ko') === 0 ? 'ko' : 'en';
  }

  function setLang(lang) {
    if (lang === state.lang) return;
    state.lang = lang;
    state.mailLang = lang;
    global.I18N.setLang(lang);
    try { global.localStorage.setItem(LANG_KEY, lang); } catch (err) { /* 무시 */ }
    applyStaticText();
    refreshOptionLabels();
    update();
  }

  /** 조회수 표시 (집계 실패 시 아무것도 그리지 않는다) */
  function renderViewCounter() {
    if (!el.viewCounter || !state.views) return;
    el.viewCounter.hidden = false;
    el.viewCounter.textContent = T('footer.views', {
      today: state.views.today.toLocaleString(),
      total: state.views.total.toLocaleString()
    });
  }

  /** data-i18n 이 붙은 정적 문구와 언어 버튼 상태를 갱신 */
  function applyStaticText() {
    document.documentElement.lang = state.lang;
    document.title = T('board.title');
    document.querySelectorAll('[data-i18n]').forEach(function (node) {
      node.textContent = T(node.getAttribute('data-i18n'));
    });
    el.langSwitch.querySelectorAll('[data-ui-lang]').forEach(function (btn) {
      btn.classList.toggle('is-active', btn.getAttribute('data-ui-lang') === state.lang);
    });
    renderViewCounter();
  }

  /** 셀렉트 박스의 옵션 문구 갱신 */
  function refreshOptionLabels() {
    el.base.querySelectorAll('option').forEach(function (opt) {
      var entity = byId[opt.value];
      if (entity) opt.textContent = entityName(entity) +
        (entityCode(entity) ? ' (' + entityCode(entity) + ')' : '');
      else if (opt.hasAttribute('data-placeholder')) opt.textContent = T('field.select');
    });
    el.duration.querySelectorAll('option').forEach(function (opt) {
      opt.textContent = opt.hasAttribute('data-placeholder')
        ? T('field.select')
        : durationLabel(+opt.getAttribute('data-duration'));
    });
    el.chips.querySelectorAll('.chip').forEach(function (chip) {
      var entity = byId[chip.querySelector('input').value];
      chip.querySelector('.chip__name').textContent = entityName(entity);
    });
  }

  function placeholderOption() {
    var opt = document.createElement('option');
    opt.value = '';
    opt.setAttribute('data-placeholder', '1');
    opt.textContent = T('field.select');
    return opt;
  }

  function goToDate(dateStr) {
    if (dateStr === state.date) return;
    state.slideDir = dateStr > state.date ? 'next' : 'prev';
    state.date = dateStr;
    el.date.value = dateStr;
    update();
  }

  function buildChips() {
    ENTITIES.forEach(function (e) {
      var label = document.createElement('label');
      label.className = 'chip';
      label.innerHTML =
        '<input type="checkbox" value="' + e.id + '">' +
        '<span class="chip__body"><span class="chip__name">' + entityName(e) + '</span>' +
        '<span class="chip__code">' + entityCode(e) + '</span></span>';
      label.querySelector('input').addEventListener('change', function (ev) {
        var id = ev.target.value;
        if (ev.target.checked) {
          if (state.participants.indexOf(id) === -1) state.participants.push(id);
        } else {
          state.participants = state.participants.filter(function (x) { return x !== id; });
        }
        update();
      });
      el.chips.appendChild(label);
    });
  }

  function syncChips() {
    el.chips.querySelectorAll('input').forEach(function (input) {
      input.checked = state.participants.indexOf(input.value) !== -1;
    });
  }

  /* ── 계산 ───────────────────────────────────────────────── */

  function participants() {
    var list = ENTITIES.filter(function (e) { return state.participants.indexOf(e.id) !== -1; });
    var base = byId[state.baseId];
    if (base && list.indexOf(base) > 0) {         // 홈 법인을 맨 위로
      list = [base].concat(list.filter(function (e) { return e !== base; }));
    }
    return list;
  }

  function update() {
    el.dateWrap.classList.toggle('is-empty', !state.date);
    el.base.classList.toggle('is-placeholder', !state.baseId);
    el.duration.classList.toggle('is-placeholder', !state.durationMin);

    var refDate = state.date || todayIn(global.CORE_TIME_BASE_TZ);
    var p = refDate.split('-');
    var policy = global.Scheduler.policyFor(+p[0], +p[1]);
    el.quarterHint.textContent = state.date
      ? T('hint.quarter', { year: p[0], q: policy.quarter.slice(1) })
      : '';
    renderDayTabs();

    var list = participants();
    var resolved = global.Scheduler.resolvePolicy(policy, state.participants, state.date);
    renderPolicyPanel(policy, resolved);

    if (!state.date || !state.baseId || !state.durationMin || !list.length) {
      state.plan = null;
      el.timetable.innerHTML = '<div class="empty"><p class="empty__title">' + T('empty.title') + '</p>' +
        '<p class="empty__text">' + T('empty.text') + '</p></div>';
      renderMail();
      return;
    }

    state.startHour = global.Scheduler.centeredStartHour(resolved, byId[state.baseId].tz, state.date);
    state.plan = global.Scheduler.planDay({
      date: state.date,
      baseTz: byId[state.baseId].tz,
      entities: list,
      durationMin: state.durationMin,
      startHour: state.startHour
    });

    if (state.selectedMinutes === null ||
        state.selectedMinutes < 0 || state.selectedMinutes >= 24 * 60) {
      state.selectedMinutes = defaultOffset(state.plan);
    }

    renderTimetable();
    renderMail();
  }

  /** 코어타임이 시작되는 칸을 기본 선택 (표 시작점부터의 경과 분) */
  function defaultOffset(plan) {
    var best = 0, bestScore = -1;
    plan.slots.forEach(function (slot) {
      var score = slot.counts.core * 4 + slot.counts.partial * 3 + slot.counts.agree * 2 + slot.counts.work - slot.counts.off * 2;
      if (score > bestScore) { bestScore = score; best = slot.offsetMin; }
    });
    return best;
  }

  /** 선택한 시각(30분 단위)을 그 자리에서 평가한다 */
  function selectedSlot() {
    if (!state.plan) return null;
    var minutes = state.selectedMinutes;
    var utcStart = state.plan.anchorUtc + minutes * 60000;
    var slot = global.Scheduler.evaluateSlot(participants(), state.plan.policy, utcStart, state.durationMin);
    slot.minutes = minutes;
    return slot;
  }

  function baseParts(slot) {
    return TZ.zonedParts(byId[state.baseId].tz, slot.utcStart);
  }

  function baseRange(slot) {
    var p = baseParts(slot);
    var startDecimal = p.decimal;
    var end = startDecimal + slot.durationMin / 60;
    return TZ.hhmm(startDecimal) + '–' + TZ.hhmm(end % 24) + (end >= 24 ? T('shift.nextDay') : '');
  }

  function localRange(row) {
    return TZ.pad(row.start.hour) + ':' + TZ.pad(row.start.minute) + '–' +
           TZ.pad(row.end.hour) + ':' + TZ.pad(row.end.minute);
  }

  /* ── 날짜 탭 ────────────────────────────────────────────── */

  function renderDayTabs() {
    if (!state.date) { el.dayTabs.innerHTML = ''; return; }
    var today = todayIn(byId[state.baseId] ? byId[state.baseId].tz : global.CORE_TIME_BASE_TZ);
    var html = ['<button type="button" class="daytab daytab--nav" data-date="' + shiftDate(state.date, -1) + '" aria-label="' + T('tt.prevDay') + '">‹</button>'];
    for (var i = -2; i <= 3; i++) {
      var d = shiftDate(state.date, i);
      var wd = weekdayOf(d);
      html.push('<button type="button" class="daytab' +
        (i === 0 ? ' is-active' : '') +
        (wd === 0 || wd === 6 ? ' is-weekend' : '') +
        (d === today ? ' is-today' : '') +
        '" data-date="' + d + '" role="tab" aria-selected="' + (i === 0) + '">' +
        (i === 0 ? fmtDate(d) : (+d.split('-')[2]) + '<span class="daytab__dow">' + dayName(wd) + '</span>') +
        '</button>');
    }
    html.push('<button type="button" class="daytab daytab--nav" data-date="' + shiftDate(state.date, 1) + '" aria-label="' + T('tt.nextDay') + '">›</button>');
    el.dayTabs.innerHTML = html.join('');
  }

  /* ── 시간표 ─────────────────────────────────────────────── */

  function renderTimetable() {
    var plan = state.plan;
    var base = byId[state.baseId];
    var rows = plan.slots[0].rows;
    var selStart = state.selectedMinutes;
    var selEnd = selStart + state.durationMin;
    // 시차와 DST 표시는 '선택한 회의 시각' 기준으로 계산한다.
    // 표가 서머타임 전환 시점을 걸쳐 있으면 첫 칸과 회의 시각의 시차가 다를 수 있다.
    var refUtc = plan.anchorUtc + selStart * 60000;

    var html = ['<div class="tt">'];
    html.push('<div class="tt__head">' +
      '<h2 class="section__title">' + T('tt.title') + '</h2>' +
      '<ul class="legend legend--flat">' +
        '<li><span class="legend__swatch legend__swatch--core"></span>' + T('tt.legendCore') + '</li>' +
        '<li><span class="legend__swatch legend__swatch--off"></span>' + T('tt.legendOff') + '</li>' +
      '</ul></div>');

    // 홈 법인이 참여자에 포함돼 있으면 그 행 자체가 기준 축이므로 눈금 행은 생략한다
    var showTicks = state.participants.indexOf(state.baseId) === -1;

    html.push('<div class="tt__body">');
    html.push('<button type="button" class="tt__nav" data-shift="-1" aria-label="' + T('tt.prevDay') + '">‹</button>');
    html.push('<div class="tt__scroll"><div class="tt__grid' +
      (state.slideDir ? ' tt__grid--' + state.slideDir : '') + '">');

    // 홈 법인 행이 곧 기준 축이므로 상단 시간 눈금 행은 두지 않는다

    rows.forEach(function (_, rowIndex) {
      var entity = rows[rowIndex].entity;
      var offsetDiff = (TZ.offsetMinutes(entity.tz, refUtc) -
                        TZ.offsetMinutes(base.tz, refUtc)) / 60;
      var diffLabel = offsetDiff === 0 ? T('tt.home') : (offsetDiff > 0 ? '+' : '') + Number(offsetDiff.toFixed(1));
      var holiday = null;
      plan.slots.forEach(function (slot) {
        if (!holiday && slot.rows[rowIndex].holiday) holiday = slot.rows[rowIndex].holiday;
      });

      html.push('<div class="tt__label">' +
        '<span class="tt__diff' + (offsetDiff === 0 ? ' is-home' : '') + '">' + diffLabel + '</span>' +
        '<span class="tt__ident">' +
          '<span class="tt__name">' + entityName(entity) + '<span class="tt__code">' + entityCode(entity) + '</span></span>' +
          '<span class="tt__city">' + cityLine(entity) +
            (TZ.isDST(entity.tz, refUtc) ? ' <span class="tag">DST</span>' : '') + '</span>' +
          (holiday ? '<span class="tag tag--off">' + holiday.name + (holiday.tentative ? T('tentative') : '') + '</span>' : '') +
        '</span>' +
      '</div>');

      // 이 법인의 시간대 오프셋이 바뀌는 칸 = 서머타임이 시작/종료되는 지점
      var prevOffset = null;

      plan.slots.forEach(function (slot) {
        var r = slot.rows[rowIndex];
        var newDay = r.start.hour === 0;
        var startMin = slot.offsetMin;
        var offsetNow = TZ.offsetMinutes(entity.tz, slot.utcStart);
        var dstShift = prevOffset !== null && offsetNow !== prevOffset;
        prevOffset = offsetNow;
        var title = entityName(entity) + ' ' + localRange(r) + ' · ' + statusLabel(r) +
          (dstShift ? ' · ' + T('tt.dstShift') : '');
        var halves = [0, 30].map(function (offset) {
          var at = startMin + offset;
          return '<button type="button" class="tt__half' +
            (at + 30 > selStart && at < selEnd ? ' is-sel' : '') +
            '" data-minutes="' + at + '" title="' + title + '"></button>';
        }).join('');
        html.push('<div class="tt__cell cell--' + r.status +
          (newDay ? ' is-newday' : '') + (dstShift ? ' is-dstshift' : '') + '">' +
          '<span class="tt__cellface">' + (newDay
            ? '<span class="tt__daymark">' + (isEn()
                ? MONTH_EN[r.start.month - 1] + '<br>' + r.start.day
                : r.start.month + '월<br>' + r.start.day) + '</span>'
            : '<span class="tt__hour">' + r.start.hour +
                // 인도(UTC+5:30)처럼 30분 단위 시차를 쓰는 지역은 분까지 보여준다
                (r.start.minute ? '<sup class="tt__min">' + TZ.pad(r.start.minute) + '</sup>' : '') +
              '</span>') + '</span>' +
          halves +
        '</div>');
      });
    });

    html.push('<div class="tt__marker" hidden></div>');
    html.push('</div></div>');
    html.push('<button type="button" class="tt__nav" data-shift="1" aria-label="' + T('tt.nextDay') + '">›</button>');
    html.push('</div>');
    html.push('<p class="tt__foot">' + T('tt.foot') + '</p>');
    html.push('</div>');
    el.timetable.innerHTML = html.join('');
    state.slideDir = null;
    positionMarker();
  }

  /** 선택한 시간대를 감싸는 상자를 실제 셀 위치에 맞춰 그린다 */
  function positionMarker() {
    var grid = el.timetable.querySelector('.tt__grid');
    var marker = el.timetable.querySelector('.tt__marker');
    if (!grid || !marker) return;

    var selected = grid.querySelectorAll('.tt__half.is-sel');
    if (!selected.length) { marker.hidden = true; return; }

    var perRow = Math.max(1, Math.ceil(state.durationMin / 30));
    var first = selected[0];
    var lastInRow = selected[Math.min(perRow, selected.length) - 1];
    var last = selected[selected.length - 1];
    var firstRect = first.getBoundingClientRect();
    var lastRect = lastInRow.getBoundingClientRect();
    var gridRect = grid.getBoundingClientRect();
    var bottomRect = last.getBoundingClientRect();

    marker.hidden = false;
    marker.style.left = (firstRect.left - gridRect.left - 2) + 'px';
    marker.style.width = (lastRect.right - firstRect.left + 4) + 'px';
    var anchor = first.parentElement;              // 첫 행의 칸을 기준으로 상자를 그린다
    marker.style.top = (anchor.offsetTop - 2) + 'px';
    marker.style.height = (bottomRect.bottom - gridRect.top - anchor.offsetTop + 4) + 'px';
  }

  /* ── 회의 소집 메일 ─────────────────────────────────────── */

  function renderMail() {
    var slot = selectedSlot();
    var lang = state.mailLang;

    var head = '<div class="panel__head">' +
      '<div><p class="panel__eyebrow panel__eyebrow--lg">' + T('mail.title') + '</p>' +
      '<p class="panel__note panel__note--lead">' + T('mail.note1') + '<br>' + T('mail.note2') + '</p>' +
      (slot
        ? '<p class="panel__when">' + fmtDate(state.date) + ' <span class="mono">' + baseRange(slot) + '</span> ' +
          '<span class="panel__whenbase">' + T('mail.basis', { name: entityName(byId[state.baseId]) }) + '</span></p>'
        : '') +
      '</div>' +
      '<div class="modeswitch modeswitch--sm">' +
        '<button type="button" class="modeswitch__btn' + (lang === 'ko' ? ' is-active' : '') + '" data-lang="ko">' + T('mail.langKo') + '</button>' +
        '<button type="button" class="modeswitch__btn' + (lang === 'en' ? ' is-active' : '') + '" data-lang="en">' + T('mail.langEn') + '</button>' +
      '</div></div>';

    var dateParts = (state.date || todayIn(global.CORE_TIME_BASE_TZ)).split('-');
    var mail = global.MailTemplate.render({
      rows: slot ? slot.rows : [],
      durationMin: state.durationMin,
      policy: state.plan ? state.plan.policy : global.Scheduler.policyFor(+dateParts[0], +dateParts[1]),
      base: byId[state.baseId] || byId.kr,
      baseParts: slot ? baseParts(slot) : null,
      baseRange: slot ? baseRange(slot) : ''
    }, lang);

    el.panelMail.innerHTML = '<section class="panel panel--mail">' + head +
      '<label class="mail__label" for="mailSubject">' + T('mail.subject') + '</label>' +
      '<input class="mail__subject" id="mailSubject" value="' + escapeAttr(mail.subject) + '">' +
      '<label class="mail__label" for="mailBody">' + T('mail.body') + '</label>' +
      '<textarea class="mail__body" id="mailBody" rows="20">' + escapeHtml(mail.body) + '</textarea>' +
      '<button type="button" class="copybtn" id="mailCopy">' + T('mail.copy') + '</button>' +
    '</section>';

    bindMailEvents();
  }

  function bindMailEvents() {
    el.panelMail.querySelectorAll('[data-lang]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        state.mailLang = btn.getAttribute('data-lang');
        renderMail();
      });
    });
    var copyBtn = document.getElementById('mailCopy');
    if (copyBtn) copyBtn.addEventListener('click', copyMail);
  }

  function copyMail() {
    var text = document.getElementById('mailBody').value;
    var btn = document.getElementById('mailCopy');
    var done = function () {
      btn.textContent = T('mail.copied');
      setTimeout(function () { btn.textContent = T('mail.copy'); }, 1800);
    };
    if (global.navigator.clipboard && global.navigator.clipboard.writeText) {
      global.navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text, done); });
    } else {
      fallbackCopy(text, done);
    }
  }

  function fallbackCopy(text, done) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); done(); } catch (err) { /* 무시 */ }
    document.body.removeChild(ta);
  }

  function escapeHtml(text) {
    return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function escapeAttr(text) {
    return escapeHtml(text).replace(/"/g, '&quot;');
  }

  /* ── 글로벌 코어타임 기준표 ─────────────────────────────── */

  /** 지금 적용 중인 편성 규칙을 한 줄로 알려준다 */
  function ruleNotice(resolved) {
    if (!resolved || !state.participants.length) return '';
    var head, body;
    if (resolved.fixedRule) {
      head = T(resolved.fixedRule.byRotation ? 'policy.rotationRule' : 'policy.fixed');
      body = isEn() ? resolved.fixedRule.noteEn : resolved.fixedRule.note;
    } else if (resolved.autoWindow) {
      head = T('policy.auto');
      body = T(resolved.autoWindow.auto === 'work' ? 'policy.autoWork' : 'policy.autoAdjacent');
    } else {
      head = T('policy.none');
      body = T('policy.noneNote');
    }
    return '<p class="notice notice--rule"><strong>' + head + '</strong> ' + body + '</p>';
  }

  /** 창의 절대 시작 시각 — 창이 자기 시간대를 가지면 그 시간대의 벽시계로 읽는다 */
  function windowStartUtc(win, dateStr) {
    var p = dateStr.split('-');
    return TZ.wallToUtc(win.tz || global.CORE_TIME_BASE_TZ, +p[0], +p[1], +p[2],
      Math.floor(win.from), Math.round((win.from % 1) * 60));
  }

  /**
   * 창을 한 법인의 현지 시각으로 환산한다.
   * 날짜는 한국 기준으로 읽어, 다른 법인은 (전일)·(익일)로 표시된다.
   */
  function localRangeOf(entity, win, dateStr) {
    var startUtc = windowStartUtc(win, dateStr);
    var endUtc = startUtc + (win.to - win.from) * 3600000;
    var base = TZ.zonedParts(global.CORE_TIME_BASE_TZ, startUtc);
    var baseDay = Date.UTC(base.year, base.month - 1, base.day);
    var s0 = TZ.zonedParts(entity.tz, startUtc);
    var e0 = TZ.zonedParts(entity.tz, endUtc);
    var startShift = Math.round((Date.UTC(s0.year, s0.month - 1, s0.day) - baseDay) / 86400000);
    var endShift = Math.round((Date.UTC(e0.year, e0.month - 1, e0.day) - baseDay) / 86400000);

    var suffix = '';
    if (startShift === -1 && endShift === -1) suffix = T('shift.prev');
    else if (startShift === -1 && endShift === 0) suffix = T('shift.prevSame');
    else if (startShift === 0 && endShift === 1) suffix = T('shift.sameNext');
    else if (startShift === 1) suffix = T('shift.next');

    return TZ.pad(s0.hour) + ':' + TZ.pad(s0.minute) + '–' +
           TZ.pad(e0.hour) + ':' + TZ.pad(e0.minute) + suffix;
  }

  /** 한 조합의 법인별 시각을 표준시 · 서머타임 두 경우로 적어 준다 */
  function ruleCell(ids, win, standardDate, dstDate) {
    return ids.map(function (id) {
      var e = byId[id];
      if (!e) return '';
      var std = localRangeOf(e, win, standardDate);
      var dst = localRangeOf(e, win, dstDate);
      return '<span class="ptime">' +
        '<span class="ptime__who">' + entityName(e) + '</span>' +
        '<span class="ptime__at mono">' + std + '</span>' +
        (dst !== std ? '<span class="ptime__at ptime__at--dst mono">(' + T('policy.dst') + ') ' + dst + '</span>' : '') +
      '</span>';
    }).join('');
  }

  function whoLabel(ids) {
    return ids.map(function (id) { return byId[id] ? entityName(byId[id]) : id; }).join(' · ');
  }

  /** 지금 선택한 참여 법인과 정확히 같은 조합인가 (표에서 강조하기 위해) */
  function isCurrentSet(ids) {
    if (state.participants.length !== ids.length) return false;
    return ids.every(function (id) { return state.participants.indexOf(id) !== -1; });
  }

  function renderPolicyPanel(policy, resolved) {
    var year = +(state.date || todayIn(global.CORE_TIME_BASE_TZ)).split('-')[0];
    var rules = global.MEETING_RULES || [];
    var rotation = rules.filter(function (r) { return !!r.byRotation; });
    var fixed = rules.filter(function (r) { return !!r.window; });

    // 표준시 · 서머타임을 모두 보여주기 위한 표본 날짜 (분기 교대는 해당 분기 안에서 고른다)
    var D = {
      oddStd: year + '-02-15', oddDst: year + '-08-15',
      evenStd: year + '-11-15', evenDst: year + '-05-15',
      std: year + '-02-15', dst: year + '-08-15'
    };

    var sec1 = rotation.length ? (
      '<h3 class="psec__title">' + T('policy.sec1') + '</h3>' +
      '<p class="psec__desc">' + T('policy.sec1Desc') + '</p>' +
      '<div class="tablewrap"><table class="ptable"><thead><tr>' +
        '<th>' + T('policy.colWho') + '</th><th>Q1 · Q3</th><th>Q2 · Q4</th>' +
      '</tr></thead><tbody>' +
      rotation.map(function (r) {
        return r.sets.map(function (ids) {
          var cur = isCurrentSet(ids);
          return '<tr' + (cur ? ' class="is-current"' : '') + '>' +
            '<td class="ptable__who">' + whoLabel(ids) + '</td>' +
            '<td' + (policy.rotation === 'Q1 · Q3' ? ' class="is-current"' : '') + '>' +
              ruleCell(ids, r.byRotation['Q1 · Q3'], D.oddStd, D.oddDst) + '</td>' +
            '<td' + (policy.rotation === 'Q2 · Q4' ? ' class="is-current"' : '') + '>' +
              ruleCell(ids, r.byRotation['Q2 · Q4'], D.evenStd, D.evenDst) + '</td>' +
          '</tr>';
        }).join('');
      }).join('') +
      '</tbody></table></div>'
    ) : '';

    var sec2 = fixed.length ? (
      '<h3 class="psec__title">' + T('policy.sec2') + '</h3>' +
      '<p class="psec__desc">' + T('policy.sec2Desc') + '</p>' +
      '<div class="tablewrap"><table class="ptable"><thead><tr>' +
        '<th>' + T('policy.colWho') + '</th><th>' + T('policy.colWhen') + '</th>' +
      '</tr></thead><tbody>' +
      fixed.map(function (r) {
        return r.sets.map(function (ids) {
          var cur = isCurrentSet(ids);
          return '<tr' + (cur ? ' class="is-current"' : '') + '>' +
            '<td class="ptable__who">' + whoLabel(ids) + '</td>' +
            '<td>' + ruleCell(ids, r.window, D.std, D.dst) + '</td>' +
          '</tr>';
        }).join('');
      }).join('') +
      '</tbody></table></div>'
    ) : '';

    var sec3 =
      '<h3 class="psec__title">' + T('policy.sec3') + '</h3>' +
      '<p class="psec__desc">' + T('policy.sec3Desc') + '<br>' + T('policy.sec3a') + '</p>';

    el.panelPolicy.innerHTML = '<section class="panel panel--policy">' +
      '<p class="panel__eyebrow panel__eyebrow--lg">' + T('policy.title') + '</p>' +
      '<p class="psec__intro">' + T('policy.intro') + '<br>' + T('policy.intro2') + '</p>' +
      ruleNotice(resolved) +
      sec1 + sec2 + sec3 +
    '</section>';
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})(window);

</script>
</body>
</html>
