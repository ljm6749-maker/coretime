<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한화비전 글로벌 코어타임</title>
<meta name="description" content="한화비전 8개 법인의 글로벌 코어타임 시간표와 회의 소집 메일 초안">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

<header class="topbar">
  <div class="topbar__brand">
    <span class="topbar__mark" aria-hidden="true"></span>
    <span class="topbar__title">HANWHA VISION</span>
    <span class="topbar__sub">글로벌 코어타임</span>
  </div>
</header>

<main>
  <section class="board" aria-labelledby="boardTitle">
    <div class="board__head">
      <p class="eyebrow">MEETING PLANNER</p>
      <h1 id="boardTitle">우리 몇 시에 만날까요?</h1>
      <p class="board__lead">날짜와 참여 법인을 고르면 각 법인의 현지 시각이 한 줄로 정렬됩니다.<br>
      <strong class="hl">붉게 칠해진 칸</strong>이 다 함께 회의할 수 있는 <strong>글로벌 코어타임</strong>입니다. 원하는 칸을 클릭한 뒤, 메일 본문을 복사해 그대로 보내세요.</p>
    </div>

    <form class="controls" id="controls" autocomplete="off">
      <div class="field">
        <label class="field__label" for="meetingDate">회의 개최일자</label>
        <input class="field__input" type="date" id="meetingDate">
        <p class="field__hint" id="quarterHint">—</p>
      </div>
      <div class="field">
        <label class="field__label" for="baseEntity">나의 소속(홈)</label>
        <select class="field__input" id="baseEntity"></select>
      </div>
      <div class="field">
        <label class="field__label" for="duration">회의 소요시간</label>
        <select class="field__input" id="duration"></select>
      </div>
      <fieldset class="field field--chips">
        <legend class="field__label">참여 법인</legend>
        <div class="chips" id="participantChips"></div>
        <div class="chips__actions">
          <button type="button" class="linkbtn" data-select="all">전체 선택</button>
          <button type="button" class="linkbtn" data-select="none">전체 해제</button>
        </div>
      </fieldset>
    </form>

    <div class="daytabs" id="dayTabs" role="tablist" aria-label="날짜 선택"></div>

    <div class="timetable" id="timetable" aria-live="polite"></div>

    <div class="panels">
      <div id="panelMail"></div>
      <div id="panelPolicy"></div>
    </div>
  </section>
</main>

<footer class="footer">
  <p>사이트 개선을 위한 의견은 <a class="footer__mail" href="mailto:jaemin@hanwha.com">jaemin@hanwha.com</a>으로 이메일 보내주세요.</p>
</footer>

<script src="assets/js/data.js"></script>
<script src="assets/js/tz.js"></script>
<script src="assets/js/scheduler.js"></script>
<script src="assets/js/mail.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
